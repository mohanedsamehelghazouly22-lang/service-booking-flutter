name: service_booking
description: Service Booking — Flutter app with Supabase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.9

  # State management
  provider: ^6.1.2

  # Auth
  google_sign_in: ^6.2.1

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Utilities
  equatable: ^2.0.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
